# Пример фрагмента Nginx для gmchessus.duckdns.org.
# Подключить после проверки фактического server-блока и сертификата.
server {
    listen 80;
    server_name gmchessus.duckdns.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name gmchessus.duckdns.org;

    # ssl_certificate /etc/letsencrypt/live/gmchessus.duckdns.org/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/gmchessus.duckdns.org/privkey.pem;

    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
    add_header X-Content-Type-Options "nosniff" always;

    root /var/www/sharks;
    index index.html;
    try_files $uri $uri/ =404;
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
